services:
  cache:
    container_name: redis
    image: redis:latest
    command: 
      - redis-server
    env_file:
      - .env
    restart: on-failure
    ports:
      - 6379:6379

  db:
    container_name: mysql
    image: mysql:latest
    restart: on-failure
    env_file:
      - .env
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASS}
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASS}
    volumes:
      - ./mysql_data:/var/lib/mysql
    ports:
      - 127.0.0.1:3307:3306
      
  bot:
    container_name: bot
    build: .
    env_file:
      - .env
    restart: always
    depends_on:
      - cache
      - db
    command: sh -c "python src/main.py"